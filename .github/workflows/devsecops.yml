name: DevSecOps CI/CD

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: devops-no-ia
  IMAGE_VERSION: "3.0"
  # Ferramentas instaladas a partir dos releases oficiais, com checksum verificado
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  SYFT_VERSION: 1.55.0
  SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d

jobs:
  # 1. Gitleaks: procura segredos em todo o histórico do repositório
  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          curl -sSLfo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Falha (exit code 1) se encontrar qualquer possível vazamento
      - name: Varredura do histórico
        run: |
          gitleaks git . \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Publicar relatório do Gitleaks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # 2. Testes unitários com cobertura (usada pelo Quality Gate do SonarCloud)
  tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest --cov=. --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  # 3. SonarCloud: SAST + Quality Gate sobre o código novo
  sonarcloud:
    name: SonarCloud (SAST + Quality Gate)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # necessário para o SonarCloud identificar o código novo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # qualitygate.wait faz o job falhar quando o Quality Gate reprova
      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # 4. Trivy: dependências declaradas no repositório
  trivy-deps:
    name: Trivy (dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Trivy
        run: |
          curl -sSLfo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP/bin" trivy
          rm trivy.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Relatório com todas as severidades: apenas registra, não bloqueia
      - name: Relatório completo (LOW a CRITICAL)
        run: |
          trivy fs . \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --output trivy-deps-report.txt
          cat trivy-deps-report.txt
          {
            echo "### Trivy — dependências (todas as severidades)"
            echo '```'
            cat trivy-deps-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-deps-report
          path: trivy-deps-report.txt
          if-no-files-found: ignore

      # Gate: falha com CRITICAL/HIGH que já possuem versão corrigida
      - name: Bloqueio CRITICAL/HIGH com correção
        run: |
          trivy fs . \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table

  # 5. Build e teste do container (etapa já existente)
  build:
    name: Build e teste da imagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build da imagem Docker
        run: |
          docker build \
            -t "${IMAGE_NAME}:${IMAGE_VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Verificar imagem criada
        run: |
          docker image inspect "${IMAGE_NAME}:${IMAGE_VERSION}" > /dev/null
          docker images "${IMAGE_NAME}"

      - name: Testar container
        run: |
          docker run -d --name teste -p 8000:8000 "${IMAGE_NAME}:${IMAGE_VERSION}"
          for i in $(seq 1 10); do
            curl -fsS http://localhost:8000/hello && break
            sleep 2
          done
          curl -fsS http://localhost:8000/hello
          docker rm -f teste

      # A mesma imagem testada é a que será analisada e publicada
      - name: Exportar imagem
        run: docker save -o image.tar "${IMAGE_NAME}:${IMAGE_VERSION}" "${IMAGE_NAME}:latest"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # 6. Trivy: imagem Docker construída
  trivy-image:
    name: Trivy (imagem)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image

      - name: Instalar Trivy
        run: |
          curl -sSLfo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP/bin" trivy
          rm trivy.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Relatório completo (LOW a CRITICAL)
        run: |
          trivy image \
            --input image.tar \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --output trivy-image-report.txt
          cat trivy-image-report.txt
          {
            echo "### Trivy — imagem Docker (todas as severidades)"
            echo '```'
            cat trivy-image-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-report
          path: trivy-image-report.txt
          if-no-files-found: ignore

      - name: Bloqueio CRITICAL/HIGH com correção
        run: |
          trivy image \
            --input image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table

  # 7. Syft: SBOM da imagem Docker
  sbom:
    name: Syft (SBOM)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image

      - name: Instalar Syft
        run: |
          curl -sSLfo syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf syft.tar.gz -C "$RUNNER_TEMP/bin" syft
          rm syft.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Gerar SBOM (SPDX, CycloneDX e tabela)
        run: |
          syft scan docker-archive:image.tar \
            -o spdx-json=sbom.spdx.json \
            -o cyclonedx-json=sbom.cyclonedx.json \
            -o table=sbom.txt
          echo "Componentes encontrados: $(($(wc -l < sbom.txt) - 1))"
          head -n 40 sbom.txt

      - name: Publicar SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
            sbom.txt

  # 8. Publicação: só em push na master e só se todas as verificações passarem
  publish:
    name: Publicar imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: [gitleaks, sonarcloud, trivy-deps, build, trivy-image, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image

      - name: Carregar imagem verificada
        run: docker load -i image.tar

      - name: Login no Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push da imagem
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for tag in "${IMAGE_VERSION}" latest; do
            docker tag "${IMAGE_NAME}:${tag}" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${tag}"
            docker push "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${tag}"
          done
